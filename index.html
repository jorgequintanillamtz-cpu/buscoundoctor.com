    <link rel="manifest" href="/manifest.json" />

    <!-- Tipografías: preconnect + <link> en vez de @import en el CSS -- así
         el navegador empieza a pedirlas desde que lee el <head>, en paralelo
         con todo lo demás, en vez de esperar a que cargue el CSS principal
         para recién ahí descubrir el @import y empezar la cadena. Esto
         reduce cuánto tarda en verse la tipografía real (antes se veía la
         de respaldo del navegador y luego brincaba el texto al cambiar --
         señalado por Google como CLS, layout shift). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Kalam:wght@300;400;700&family=Caveat:wght@400;500;600;700&display=swap" />
