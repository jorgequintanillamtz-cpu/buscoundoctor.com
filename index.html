<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- La ?v=3 obliga a los navegadores a descargar el ícono nuevo (Chrome guarda los viejos mucho tiempo). Si cambias el diseño, sube el número. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Tipografías: preconnect + <link> en vez de @import en el CSS -- así
         el navegador empieza a pedirlas desde que lee el <head>, en paralelo
         con todo lo demás, en vez de esperar a que cargue el CSS principal
         para recién ahí descubrir el @import y empezar la cadena. Esto
         reduce cuánto tarda en verse la tipografía real (antes se veía la
         de respaldo del navegador y luego brincaba el texto al cambiar --
         señalado por Google como CLS, layout shift). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Kalam:wght@300;400;700&family=Caveat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&display=swap" />
